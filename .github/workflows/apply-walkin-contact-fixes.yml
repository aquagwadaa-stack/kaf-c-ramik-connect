name: Apply walk-in contact improvements

on:
  push:
    paths:
      - .github/workflows/apply-walkin-contact-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted patch
        run: python scripts/apply_walkin_contact_fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Verify build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-walkin-contact-fixes.yml scripts/apply_walkin_contact_fixes.py
          git add src/routes/admin.tsx src/lib/reservations.ts
          git commit -m "Add optional contacts to team reservations"
          git push
