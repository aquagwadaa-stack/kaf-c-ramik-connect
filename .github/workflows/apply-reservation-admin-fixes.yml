name: Apply reservation admin fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply targeted reservation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reservations = Path("src/lib/reservations.ts")
          text = reservations.read_text(encoding="utf-8")
          old = '''    status: "arrived",\n    seatingUnitId: input.seatingUnitId,'''
          new = '''    status: "confirmed",\n    seatingUnitId: input.seatingUnitId,'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one local walk-in status occurrence, found {text.count(old)}")
          reservations.write_text(text.replace(old, new, 1), encoding="utf-8")

          admin = Path("src/routes/admin.tsx")
          text = admin.read_text(encoding="utf-8")
          old = '''          disabled={deleting}\n          className="rounded-full border border-destructive/30 px-3 py-1 text-xs text-destructive hover:bg-destructive/10"\n        >\n          {deleting ? "Suppression…" : "Supprimer"}'''
          new = '''          disabled={deleting}\n          className="ml-auto rounded-full border border-destructive/30 px-3 py-1 text-xs text-destructive hover:bg-destructive/10"\n        >\n          {deleting ? "Suppression…" : "Supprimer"}'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one reservation delete button occurrence, found {text.count(old)}")
          admin.write_text(text.replace(old, new, 1), encoding="utf-8")

          migration = Path("drizzle/migrations/0001_walk_in_future_not_arrived.sql")
          text = migration.read_text(encoding="utf-8")
          old = "  new_status := case when p_date = timezone('America/Guadeloupe', now())::date then 'arrived' else 'confirmed' end;"
          new = "  new_status := 'confirmed';"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one database walk-in status rule, found {text.count(old)}")
          migration.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/apply-reservation-admin-fixes.yml")
          workflow.unlink()
          PY

      - name: Commit targeted fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/reservations.ts src/routes/admin.tsx drizzle/migrations/0001_walk_in_future_not_arrived.sql .github/workflows/apply-reservation-admin-fixes.yml
          git diff --cached --check
          git commit -m "Fix admin-added reservation status and delete action"
          git push
